# Full stack:      docker compose up --build
# Database only:   docker compose up -d postgres   (for `pnpm dev`)
name: squadai

x-database-url: &database-url postgres://squadai:squadai@postgres:5432/squadai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: squadai
      POSTGRES_PASSWORD: squadai
      POSTGRES_DB: squadai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squadai -d squadai"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., target: worker }
    command: ["node", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      SQUADAI_MASTER_KEY: ${SQUADAI_MASTER_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SQUADAI_MASTER_KEY: ${SQUADAI_MASTER_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

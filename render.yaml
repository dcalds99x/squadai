# One-click public demo on Render:
#   https://render.com/deploy?repo=https://github.com/dcalds99x/squadai
# Demo mode is forced on (SQUADAI_PUBLIC_DEMO=1): visitors get every team and
# sample work, and nobody can store API keys or connect other systems.
# For a private install with real models, drop SQUADAI_PUBLIC_DEMO.
databases:
  - name: squadai-db
    databaseName: squadai
    user: squadai
    plan: free

envVarGroups:
  - name: squadai-shared
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: SQUADAI_MASTER_KEY
        generateValue: true
      - key: SQUADAI_PUBLIC_DEMO
        value: "1"
      - key: SQUADAI_DEMO_DELAY_MS
        value: "900"

services:
  # Web app. Its default command applies migrations first.
  - type: web
    name: squadai-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - fromGroup: squadai-shared
      - key: DATABASE_URL
        fromDatabase:
          name: squadai-db
          property: connectionString

  # Runs the teams. Render has no free background workers: the smallest paid plan works.
  - type: worker
    name: squadai-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/worker/src/index.ts
    plan: starter
    envVars:
      - fromGroup: squadai-shared
      - key: DATABASE_URL
        fromDatabase:
          name: squadai-db
          property: connectionString
